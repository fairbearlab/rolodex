name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Shared fairbearlab Go CI: lint (golangci-lint), test (vet, -race, tidy -diff), vulncheck.
  go:
    uses: fairbearlab/.github/.github/workflows/go-ci.yml@main

  # Repo-local coverage floor. Deliberately NOT in the shared go-ci workflow: floors are
  # per-repo, and choosepaste has no Go-only floor to speak of.
  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Coverage (enforces COVER_MIN)
        run: make cover
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          # The `make cover` floor above is the real gate; a Codecov outage should not
          # turn CI red. Uploads are authorized by the Codecov GitHub App, not a token.
          fail_ci_if_error: false

  # Repo-specific: build + smoke-run the benchmarks so they don't rot.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Benchmark
        run: go test -bench=. -benchtime=1x ./cmd/rolodex/
