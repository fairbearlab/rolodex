# Destination: <repo>/.golangci.yml  (rolodex: repo root; choosepaste: engine/.golangci.yml)
# Shared standard for all fairbearlab Go repos. Session agent: verify against the
# golangci-lint version installed in CI and adjust schema if needed (this is v2 format).
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - gosec
    - copyloopvar
    - unconvert
  settings:
    gosec:
      excludes:
        - G304 # file inclusion via variable — both repos legitimately open user-supplied paths

formatters:
  enable:
    - gofmt
