version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - gosec
    - copyloopvar
    - unconvert
  settings:
    gosec:
      excludes:
        - G304 # file inclusion via variable — both repos legitimately open user-supplied paths
        - G703 # path traversal via taint analysis (gosec ≥ v2.12) — same rationale: user-supplied output paths

formatters:
  enable:
    - gofmt
